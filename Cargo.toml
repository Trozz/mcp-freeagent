[workspace]
resolver = "3"
members = [
    "crates/mcp-freeagent-books",
    "crates/mcp-freeagent",
]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Trozz/mcp-freeagent"

[workspace.dependencies]
# The shared MCP server base: OAuth 2.1, sign-in (including FreeAgent's own OAuth, through its
# `upstream` module), TLS, routing, observability.
mcp-server-core = "0.2"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.20"
axum = "0.8.9"
url = "2.5.8"
base64 = "0.23.1"
ring = "0.17.14"
secrecy = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "form"] }
metrics = "0.24.6"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
